   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

function setState(n,k=0){
 const phaseSelector='.visual .reveal,.visual table tbody td,.visual .guideFoot';
 const oldKind=slides[index].kind,oldIndex=index;
 const before=[...by('page').querySelectorAll(phaseSelector)].map(el=>({opacity:Number(getComputedStyle(el).opacity),text:el.innerText,visible:el.firstElementChild?.style.visibility!=='hidden'}));
 index=Math.max(0,Math.min(slides.length-1,n));step=Math.max(0,Math.min((steps[slides[index].kind]||1)-1,k));
 const hash='#'+(index+1)+'-'+(step+1);
 if(location.hash!==hash)history.replaceState(null,'',hash);
 render();
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches && (index===oldIndex || [oldKind,slides[index].kind].every(k=>['timeline','bridge'].includes(k)))){
  [...by('page').querySelectorAll(phaseSelector)].forEach((el,i)=>{
   const was=before[i],now=Number(getComputedStyle(el).opacity);
   if(!was)return;
   const changed=was.text!==el.innerText||was.visible!==(el.firstElementChild?.style.visibility!=='hidden');
   if(was.opacity!==now||changed)el.animate([{opacity:changed?0.25:was.opacity,transform:changed?'translateY(7px)':'none'},{opacity:now,transform:'none'}],{duration:350,easing:'ease-out'});
  });
 }
}

 show('detail','원본 상세자료', '<div class="tools"><button id="oprev" '+(n===1?'disabled':'')+'>← 이전 원본</button><select aria-label="원본 슬라이드 선택" id="origselect">'+pick+'</select><button id="onext" '+(n===78?'disabled':'')+'>다음 원본 →</button><button id="zoom" aria-pressed="false">확대</button></div><p class="stamps"><strong>PDF '+page+'쪽 '+(n%2?'위':'아래')+'</strong> · 책자 '+(page-4)+'쪽　'+clipLink(n)+'</p><div class="orig" id="origbox"><img alt="'+esc(titles[n-1])+' · 원본 '+n+'번" src="'+images[n-1]+'"></div><p class="verify">'+esc(marks[n]||'2026년 7월 자료집 원문입니다. 공식 문서와 대조한 범위는 이 발표의 근거 보기에서 확인할 수 있습니다. 상세표 각 셀의 개별 검증은 별도 표시된 항목에 한합니다.')+'</p><div class="tools"><button id="detailproof">근거 보기</button><button data-indexlist>78장 대조표</button></div>');
 by('oprev').onclick=()=>details(n-1);by('onext').onclick=()=>details(n+1);by('origselect').onchange=e=>details(Number(e.target.value));
 by('zoom').onclick=e=>{const zoom=by('origbox').classList.toggle('zoom');e.target.textContent=zoom?'화면에 맞춤':'확대';e.target.setAttribute('aria-pressed',String(zoom))};
 by('detailproof').onclick=()=>proof(n);
}
function related(n){return slides.map((s,i)=>[s,i]).filter(([s])=>s.g<7&&n>=s.lo&&n<=s.hi)}
function proof(n){
 const fromDetail=Number.isInteger(n),s=fromDetail?(related(n).find(([s])=>s.src.length)?.[0]||related(n)[0][0]):slides[index];
 const first=fromDetail?n:s.lo,last=fromDetail?n:s.hi;
 const links=Array.from({length:last-first+1},(_,i)=>{const x=first+i;return '<div class="refrow"><button data-orig="'+x+'">원본 '+x+' · '+esc(titles[x-1])+'</button>　'+clipLink(x)+'</div>'}).join('');
 show('proof','발표 근거',cap('대조일 2026.11.19')+'<h3>'+esc(s.title.replace('\n',' '))+'</h3><p class="verify">'+esc(s.proof)+'</p>'+s.src.map(linkrow).join('')+'<h3>강연과 원본</h3><p>한국대학교육협의회 대입상담센터, 2028 대입 정보 설명회 자료집 제2부(2026년 7월). PDF '+(27+Math.floor((first-1)/2))+'~'+(27+Math.floor((last-1)/2))+'쪽. 표와 대학별 수치는 해당 자료의 기준 시점에 따릅니다.</p>'+links+'<button data-indexlist>전체 원본 대조표 보기</button>');
}
function indexList(){
 const rows=titles.map((t,k)=>{const n=k+1;const items=related(n);return '<div class="refrow"><button data-orig="'+n+'">'+n+'. '+esc(t)+'</button> · PDF '+(27+Math.floor(k/2))+'쪽　'+clipLink(n)+'<small>연결 화면　'+items.map(([s,i])=>'<button data-jump="'+i+'">'+esc(s.title.replace('\n',' '))+'</button>').join(' ')+'</small></div>'}).join('');
 show('index','원본 78장 대조표','<p>영상 오른쪽 슬라이드와 PDF를 1초 간격으로 대조했습니다. 시각은 같은 화면을 식별한 구간입니다. 발표에서 생략된 권역도 자료집 순서대로 열 수 있습니다.</p>'+rows);
}
function menu(){
 show('menu','발표 목차','<div class="tools">'+jump(1,'1부 전형 변화')+jump(27,'2부 대입 지도')+'<button data-indexlist>원본 78장 대조표</button></div><div class="topicIndex"><button data-jump="2">지역별 비율 도표</button><button data-jump="27">준비 시간표</button><button data-jump="29">전형 비교표</button></div>'+chapters.slice(1).map((c,j)=>'<h3>'+esc(c)+'</h3><div class="jumpall">'+slides.map((s,i)=>s.g===j+1?'<button data-jump="'+i+'" class="indexitem">'+(i+1)+'　'+esc(s.title)+'</button>':'').join('')+'</div>').join(''));
}
by('close').onclick=()=>by('modal').close();by('modal').onclose=()=>{dialogMode='';if(priorFocus?.isConnected)priorFocus.focus()};
document.onclick=e=>{const target=e.target.closest('button');if(!target)return;
 if(target.hasAttribute('data-jump')){if(by('modal').open)by('modal').close();setState(Number(target.dataset.jump))}
 if(target.hasAttribute('data-orig'))details(Number(target.dataset.orig));
 if(target.hasAttribute('data-indexlist'))indexList();
};
by('menu').onclick=menu;by('source').onclick=()=>proof();by('detail').onclick=()=>details(slides[index].kind==='region'?7:slides[index].lo);
by('next').onclick=()=>move(1);by('back').onclick=()=>move(-1);
async function full(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{show('help','전체화면','<p>브라우저의 전체화면 메뉴 또는 F11을 사용하세요.</p>')}}
by('full').onclick=full;document.onfullscreenchange=()=>{by('full').textContent=document.fullscreenElement?'전체화면 종료':'전체화면';fit()};
document.addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(by('modal').open){if(dialogMode==='detail' && e.target.tagName!=='SELECT'){if(e.key==='ArrowRight'&&original<78){e.preventDefault();details(original+1)}if(e.key==='ArrowLeft'&&original>1){e.preventDefault();details(original-1)}}return}
 if(e.key===' ' && e.target.tagName==='BUTTON'&&!['next','back'].includes(e.target.id))return;
 if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();move(1)}
 else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();move(-1)}
 else if(e.key==='Home'){e.preventDefault();setState(0)}else if(e.key==='End'){e.preventDefault();setState(slides.length-1)}else if(e.key.toLowerCase()==='f')full();else if(e.key.toLowerCase()==='m')menu();
});
let touch=null;by('page').addEventListener('touchstart',e=>{touch=[e.touches[0].clientX,e.touches[0].clientY]}, {passive:true});
by('page').addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch[0],dy=e.changedTouches[0].clientY-touch[1];touch=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.5)move(dx<0?1:-1)},{passive:true});
window.addEventListener('hashchange',fromHash);window.addEventListener('resize',fit);fit();fromHash();

</script></body></html>
